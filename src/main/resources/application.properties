spring.application.name=geekonsites-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:geekonsites}
spring.datasource.username=${DB_USERNAME:geekonsites}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# PHASE 8 — Flyway schema migrations.
# Default (dev/test): Flyway is disabled and Hibernate keeps ddl-auto=update, matching
# how the H2 test suite and local development have always worked.
# Production profile enables Flyway and switches Hibernate to validate; see
# application-production.properties and DATABASE_MIGRATION_RUNBOOK.md.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=pre-flyway baseline
spring.flyway.validate-on-migrate=true
spring.jpa.properties.hibernate.format_sql=false
app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:GeekOnSites Support}
app.mail.support-address=${SUPPORT_EMAIL:support@geekonsites.com}
app.technician-onboarding.setup-url=${TECHNICIAN_SETUP_URL:https://geekonsites.com/technician/set-password}
app.password-reset.allowed-origins=${PASSWORD_RESET_ALLOWED_ORIGINS:https://geekonsites.com,https://www.geekonsites.com}

# Resend HTTPS API — used only for password-reset email delivery, since
# Render's free web service plan blocks outbound SMTP ports (25/465/587).
resend.api-key=${RESEND_API_KEY:}
resend.password-reset.from=${RESEND_PASSWORD_RESET_FROM:GeekOnSites Support <support@geekonsites.com>}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://geekonsites.com,https://www.geekonsites.com}

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.success.url=${STRIPE_SUCCESS_URL:https://geekonsites.com/payment-success}
stripe.cancel.url=${STRIPE_CANCEL_URL:https://geekonsites.com/payment-cancel}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# PHASE 6 — seed the service catalog from the historical hardcoded catalog on startup (idempotent).
app.catalog.seed=${CATALOG_SEED:true}

# PHASE 9 — bounded recovery of critical external side effects (excess-capture reversal,
# Google Calendar provisioning). Disabled by default (dev/test); enabled in production.
app.recovery.enabled=${RECOVERY_ENABLED:false}
app.recovery.batch-size=${RECOVERY_BATCH_SIZE:20}
app.recovery.max-attempts=${RECOVERY_MAX_ATTEMPTS:8}
app.recovery.fixed-delay-ms=${RECOVERY_FIXED_DELAY_MS:60000}
app.recovery.initial-delay-ms=${RECOVERY_INITIAL_DELAY_MS:30000}
app.recovery.base-backoff-seconds=${RECOVERY_BASE_BACKOFF_SECONDS:60}

spring.main.lazy-initialization=true
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Google Calendar creates one Meet event after a verified full remote payment.
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
google.calendar.oauth-client-json=${GOOGLE_CALENDAR_OAUTH_CLIENT_JSON:}
google.calendar.refresh-token=${GOOGLE_CALENDAR_REFRESH_TOKEN:}
google.calendar.id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.time-zone=${GOOGLE_CALENDAR_TIME_ZONE:UTC}

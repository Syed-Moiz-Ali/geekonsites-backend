# Disposable local development database. Render and production always use PostgreSQL.
spring.datasource.url=jdbc:h2:file:./local-data/geekonsites-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=gos_local
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
stripe.success.url=http://localhost:5173/payment-success
stripe.cancel.url=http://localhost:5173/payment
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:local-webhook-not-configured}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost,capacitor://localhost
app.password-reset.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

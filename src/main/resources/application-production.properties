# PHASE 8 — production schema is owned by Flyway. Hibernate must NEVER mutate it:
# it only validates that the entities match the migrated schema at startup.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=pre-flyway baseline
spring.flyway.validate-on-migrate=true
# A failed migration aborts startup before the app can serve traffic.
spring.flyway.fail-on-missing-locations=true
spring.jpa.open-in-view=false

# PHASE 9 — enable the bounded recovery worker in production only.
app.recovery.enabled=${RECOVERY_ENABLED:true}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.enabled-by-default=false
